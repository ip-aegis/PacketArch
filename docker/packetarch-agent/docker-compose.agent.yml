# PacketArch Agent Stack
# Deploys the agent container with auto-update via Watchtower

services:
  agent:
    image: ghcr.io/ip-aegis/packetarch-agent:latest
    container_name: packetarch-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # Mount Docker socket for self-update capability
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount install directory so agent can use docker compose for self-update
      - ${AGENT_INSTALL_PATH:-/opt/packetarch-agent}:/opt/packetarch-agent:rw
    environment:
      - PACKETARCH_SERVER=${PACKETARCH_SERVER}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - DEFAULT_INTERFACE=${DEFAULT_INTERFACE:-eth0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SSL_VERIFY=${SSL_VERIFY:-false}
      - AGENT_INSTALL_PATH=/opt/packetarch-agent
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    container_name: packetarch-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
