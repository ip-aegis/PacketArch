# Offline docker-compose for PacketArch release bundles.
# Uses pre-built images loaded by install.sh (no `build:` stanzas). The
# VERSION file at the bundle root drives which tags are loaded.

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: packetarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: packetarch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetarch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: packetarch/backend:${PACKETARCH_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://packetarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/packetarch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FIRST_USER_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      DEBUG: ${DEBUG:-false}
    expose:
      - "8001"
    volumes:
      - pcap_uploads:/app/data/pcap_uploads
      - pcap_output:/app/output/pcap
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  celery_worker:
    image: packetarch/backend:${PACKETARCH_VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.traffic_generator.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://packetarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/packetarch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FIRST_USER_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
    volumes:
      - pcap_output:/app/output/pcap
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.traffic_generator.tasks.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    image: packetarch/frontend:${PACKETARCH_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
      # Drop real cert/key into ./certs/ to override the self-signed default.
      - ./certs:/etc/nginx/custom-certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pcap_uploads:
  pcap_output:
  ssl_certs:
