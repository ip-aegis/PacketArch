# Standalone appliance: don't let cloud-init manage networking (no datasource
# to derive it from, and its datasource detection can stall first boot). The
# baked static netplan (/etc/netplan/99-appliance.yaml) handles DHCP instead.
# This disables ONLY cloud-init's network module. Do NOT rely on the rest of
# cloud-init running: a standalone appliance has no datasource, so ds-identify
# disables cloud-init outright ("disabled-by-generator") and NONE of its
# modules run -- including ssh host key regeneration. firstboot.sh does that
# itself (ssh-keygen -A); without it sshd has no host keys and never starts.
network: {config: disabled}
