services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: packetarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: packetarch
    # Bound to loopback only — DB is reached by other containers over the
    # internal Docker network (host "postgres"), never the published port.
    # For off-box DB access use an SSH tunnel rather than exposing 5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packetarch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Loopback only — reached by other containers via host "redis".
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    group_add:
      # Must match the host's docker group GID so the backend can reach the
      # mounted Docker socket. Set DOCKER_GID in .env (getent group docker
      # | cut -d: -f3). Defaults to 987 (this dev host) if unset.
      - "${DOCKER_GID:-987}"
    security_opt:
      - label:disable  # Disable SELinux label separation for Docker socket access
    environment:
      DATABASE_URL: postgresql+asyncpg://packetarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/packetarch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Optional headless-admin bootstrap. Unset (default) => first boot shows
      # the setup wizard. Set => auto-create admin and skip the wizard.
      FIRST_USER_PASSWORD: ${ADMIN_PASSWORD:-}
      DEBUG: ${DEBUG:-false}
      # Entrypoint applies alembic deltas before uvicorn (create_all stays the
      # baseline). ONLY set on backend (celery_worker must not migrate).
      RUN_MIGRATIONS: "true"
      # Self-upgrade: host install dir (so the backend can launch the updater
      # container against the real repo) + pinned compose project name + docker
      # group GID for the updater's socket access.
      HOST_INSTALL_DIR: ${HOST_INSTALL_DIR:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-packetarch}
      DOCKER_GID: ${DOCKER_GID:-987}
      # Local-sensor file-queue root (shared with the host-agent service).
      HOST_AGENT_STATE: /hostagent/local-labs
      # Cisco CIRCUIT provider — env-var overrides for the encrypted
      # system_settings rows. Empty/unset = use whatever's in the DB.
      CIRCUIT_CLIENT_ID: ${CIRCUIT_CLIENT_ID:-}
      CIRCUIT_CLIENT_SECRET: ${CIRCUIT_CLIENT_SECRET:-}
      CIRCUIT_APP_KEY: ${CIRCUIT_APP_KEY:-}
      CIRCUIT_MODEL: ${CIRCUIT_MODEL:-}
    # Backend is only accessible via nginx proxy (not exposed to host)
    expose:
      - "8001"
    volumes:
      - pcap_uploads:/app/data/pcap_uploads
      - pcap_output:/app/output/pcap
      - ./docker/packetarch-agent:/docker/packetarch-agent:ro
      # Updater build context (for build-on-demand if the image is missing).
      - ./docker/packetarch-updater:/docker/packetarch-updater:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with the updater container; survives backend recreate so the
      # self-upgrade status outlives the backend restarting mid-upgrade.
      - upgrade_state:/state
      # Shared file-queue with the host-agent: the backend writes local-sensor
      # lab specs/requests here; the host-agent (privileged) acts on them. The
      # backend itself stays unprivileged — it only reads/writes JSON.
      - host_agent_state:/hostagent
      # Built agent image/artifacts — persists across `up --build` so the served
      # agent doesn't revert to a stale baked tarball (auto-rebuilt on boot if stale).
      - agent_dist:/app/app/static/agent/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.traffic_generator.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://packetarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/packetarch
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Optional headless-admin bootstrap (mirrors backend); unset => wizard.
      FIRST_USER_PASSWORD: ${ADMIN_PASSWORD:-}
      # CIRCUIT pass-through (same set as backend service so PCAP /
      # Celery-driven AI calls have access to the same provider).
      CIRCUIT_CLIENT_ID: ${CIRCUIT_CLIENT_ID:-}
      CIRCUIT_CLIENT_SECRET: ${CIRCUIT_CLIENT_SECRET:-}
      CIRCUIT_APP_KEY: ${CIRCUIT_APP_KEY:-}
      CIRCUIT_MODEL: ${CIRCUIT_MODEL:-}
    volumes:
      - pcap_output:/app/output/pcap
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Celery worker doesn't run a web server, so use celery inspect ping
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.traffic_generator.tasks.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP -> HTTPS redirect (nginx returns 301 to 443)
      - "443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
      # Drop real certificate at ./certs/server.{crt,key} to override the
      # self-signed default. See frontend/docker-entrypoint.sh.
      - ./certs:/etc/nginx/custom-certs:ro
    depends_on:
      backend:
        condition: service_healthy

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@packetarch.local
      PGADMIN_DEFAULT_PASSWORD: admin
    # Loopback only — weak default creds, opt-in via the "tools" profile.
    # Reach it through an SSH tunnel: ssh -L 5050:localhost:5050 <server>
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  # Host-agent: long-running privileged sibling that owns ALL host-level ops for
  # local sensor labs (per-lab veth crossovers, /etc/docker/daemon.json registry
  # trust, per-lab CV-sensor + traffic-agent containers). The unprivileged
  # backend never touches the host — it drops request files on the shared
  # host_agent_state volume and this watcher acts on them + reconciles desired
  # specs on boot (so labs survive reboots). Idles cheaply when no labs exist.
  # privileged + network_mode host (veth in host netns) + pid host (SIGHUP the
  # host dockerd to live-reload daemon.json — never restart).
  host-agent:
    build: ./docker/packetarch-host-agent
    image: packetarch-host-agent:latest
    container_name: ${COMPOSE_PROJECT_NAME:-packetarch}-host-agent
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-packetarch}
      HOST_AGENT_STATE: /hostagent/local-labs
      LOG_LEVEL: ${HOST_AGENT_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker:/etc/docker            # daemon.json (insecure-registries)
      - host_agent_state:/hostagent        # file-queue shared with the backend
      - ./docker/packetarch-host-agent:/app:ro  # live-edit watcher w/o rebuild

  # Self-upgrade runner. Never auto-starts (profiled). The backend launches a
  # one-off container FROM this image via the Docker socket to run
  # scripts/upgrade.sh; because that container is standalone (not a tracked
  # compose service), upgrade.sh's `docker compose up -d --build` recreate
  # can't kill it mid-run. Defined here so the image is versioned with the repo
  # and built alongside the rest: `docker compose --profile updater build`.
  # The pinned `image:` name is what the backend references.
  updater:
    profiles: ["updater"]
    build: ./docker/packetarch-updater
    image: packetarch-updater:latest
    working_dir: /repo
    group_add:
      - "${DOCKER_GID:-987}"
    security_opt:
      - label:disable
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-packetarch}
      DOCKER_GID: ${DOCKER_GID:-987}
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - upgrade_state:/state

volumes:
  postgres_data:
  redis_data:
  pcap_uploads:
  pcap_output:
  ssl_certs:
  upgrade_state:
  agent_dist:
  host_agent_state:
