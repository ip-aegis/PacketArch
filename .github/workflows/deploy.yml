name: Deploy to Production

# Manual-only: the push trigger was removed because deploys are done locally
# (dev = prod on this box) and the SSH_HOST/SSH_USER/SSH_PRIVATE_KEY secrets this
# job needs are not configured — leaving the push trigger made every push go red.
# Configure those repo secrets and run from the Actions tab to use CI deploy.
on:
  workflow_dispatch:

env:
  REMOTE_DIR: /home/${{ secrets.SSH_USER }}/packetarch

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          echo "Syncing files to production server..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude '.env' \
            --exclude '*.pyc' \
            --exclude '.pytest_cache' \
            --exclude '.mypy_cache' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '*.egg-info' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}/

      - name: Build and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e

            echo "=== Deployment started ==="

            cd ~/packetarch

            # Create/update .env if it doesn't exist
            if [ ! -f .env ]; then
              echo "Creating .env file..."
              cat > .env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          DEBUG=false
          ENVEOF
            fi

            # Build and restart containers
            echo "Building and starting containers..."
            sudo /usr/bin/docker compose down || true
            sudo /usr/bin/docker compose up -d --build

            # Wait for services to be healthy
            echo "Waiting for services to start..."
            for i in $(seq 1 30); do
              if sudo /usr/bin/docker compose ps --format json | grep -q '"Health":"healthy"'; then
                echo "Services healthy after $((i * 10)) seconds"
                break
              fi
              echo "Attempt $i/30: waiting..."
              sleep 10
            done

            # Show status
            echo "=== Container Status ==="
            sudo /usr/bin/docker compose ps

            echo "=== Deployment complete ==="
          ENDSSH

      - name: Health check
        run: |
          echo "Verifying deployment health..."
          for i in $(seq 1 6); do
            if curl -sfk https://${{ secrets.SSH_HOST }}/health || \
               curl -sf http://${{ secrets.SSH_HOST }}:8001/health; then
              echo "Health check passed!"
              echo "Access URL: https://${{ secrets.SSH_HOST }}"
              exit 0
            fi
            echo "Retry $i/6..."
            sleep 10
          done
          echo "Health check failed after 60 seconds"
          exit 1
