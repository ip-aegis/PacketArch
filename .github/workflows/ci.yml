name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install ruff

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check . --select=E,F,W --ignore=E501

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run ESLint
        run: |
          cd frontend
          pnpm lint

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: |
          cd backend
          poetry install --no-interaction

      - name: Run tests with coverage
        run: |
          cd backend
          poetry run pytest -x --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=50
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key-for-ci-minimum-32-characters"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run tests
        run: |
          cd frontend
          pnpm exec vitest run

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build --no-cache
        env:
          POSTGRES_PASSWORD: test_password
          SECRET_KEY: test_secret_key
          ADMIN_PASSWORD: test_admin

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              echo "Services healthy after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/30: waiting..."
            sleep 10
          done
        env:
          POSTGRES_PASSWORD: test_password
          SECRET_KEY: test_secret_key
          ADMIN_PASSWORD: test_admin

      - name: Check services health
        run: |
          docker compose ps
          for i in $(seq 1 6); do
            if curl -sf http://localhost:8001/api/v1/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Retry $i/6..."
            sleep 10
          done
          echo "Health check failed after 60 seconds"
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
