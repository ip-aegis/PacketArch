name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install ruff

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check . --select=E,F,W --ignore=E501

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run ESLint
        run: |
          cd frontend
          pnpm lint || true  # Don't fail on lint warnings for now

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build --no-cache
        env:
          POSTGRES_PASSWORD: test_password
          SECRET_KEY: test_secret_key
          ADMIN_PASSWORD: test_admin

      - name: Start services
        run: |
          docker compose up -d
          sleep 30
        env:
          POSTGRES_PASSWORD: test_password
          SECRET_KEY: test_secret_key
          ADMIN_PASSWORD: test_admin

      - name: Check services health
        run: |
          docker compose ps
          curl -sf http://localhost:8001/api/v1/health || echo "Backend starting..."

      - name: Stop services
        run: docker compose down -v
