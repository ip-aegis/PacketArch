name: Release

# Triggered by pushing a tag matching v*.
#
# Produces:
#   - THIRD_PARTY_LICENSES.md (best-effort; regenerated from pyproject + package.json)
#   - packetarch-<version>-offline.tar.gz (via scripts/build-release.sh)
#   - packetarch-<version>-appliance.ova  (via scripts/ova/build-ova.sh)
# These artifacts are attached to a GitHub Release for the pushed tag, and
# uploaded as workflow artifacts regardless of whether the release step
# succeeds (so failed-release builds are still recoverable).
#
# The OVA is built by the `build-ova` job on a SELF-HOSTED runner labeled
# `ova-builder` (a KVM host) — GitHub-hosted runners can't run libguestfs/
# virt-customize reliably (passt fails in the sandbox; slirp DNS is flaky). If
# that runner is offline the build-ova job queues, but the bundle jobs still
# publish their assets to the release.
#
# Optional GHCR image push is stubbed below — uncomment once the
# ip-aegis/packetarch repo has `packages: write` enabled and the desired
# image namespace has been confirmed with Rocky.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version tag to publish as (manual runs only)"
        required: false
        type: string

permissions:
  contents: write       # needed to create the GitHub Release
  packages: write       # publish the agent image to GHCR (build once, distribute)

jobs:
  build:
    name: Build release bundle (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            pcap_only: "0"
          - variant: pcap-only
            pcap_only: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # for `git describe` / commit metadata

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
              && -n "${{ inputs.version_override }}" ]]; then
              VERSION="${{ inputs.version_override }}"
          else
              VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      # Third-party attribution — best effort. A dep-resolution failure
      # should NOT block the release; the downstream build step logs
      # a warning if THIRD_PARTY_LICENSES.md is missing.
      - name: Install backend dependencies (for pip-licenses)
        run: |
          cd backend
          poetry install --no-interaction --no-root || true

      - name: Install frontend dependencies (for license-checker)
        run: |
          cd frontend
          pnpm install --frozen-lockfile || true

      - name: Generate third-party attribution
        continue-on-error: true
        run: ./scripts/generate_third_party_licenses.sh

      - name: Build offline release bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PCAP_ONLY: ${{ matrix.pcap_only }}
        run: ./scripts/build-release.sh

      - name: Compute artifact paths
        id: paths
        run: |
          if [[ "${{ matrix.variant }}" == "pcap-only" ]]; then
              TARBALL="$(ls dist/packetarch-*-pcap-offline.tar.gz | head -1)"
          else
              # Full variant: exclude any pcap-suffixed tarballs.
              TARBALL="$(ls dist/packetarch-*-offline.tar.gz | grep -v -- '-pcap-' | head -1)"
          fi
          echo "TARBALL=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Tarball: ${TARBALL} ($(du -h "${TARBALL}" | awk '{print $1}'))"

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: packetarch-offline-bundle-${{ matrix.variant }}
          path: |
            ${{ steps.paths.outputs.TARBALL }}
            THIRD_PARTY_LICENSES.md
          if-no-files-found: warn
          retention-days: 30

      - name: Stage release notes for attachment
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Give the HTML file a versioned name so it's unambiguous in the release assets list.
          cp frontend/public/release-notes.html \
             "packetarch-${VERSION}-release-notes.html"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: PacketArch ${{ github.ref_name }}
          draft: true       # Rocky publishes manually after sanity-checking the assets
          generate_release_notes: true
          files: |
            ${{ steps.paths.outputs.TARBALL }}
            packetarch-${{ steps.version.outputs.VERSION }}-release-notes.html
            THIRD_PARTY_LICENSES.md
            LICENSE
            NOTICE

      # --- Publish the agent image to GHCR ----------------------------
      # So internet-connected installs auto-pull the labeled agent image on boot
      # and re-serve it (startup.ensure_agent_image_current) — no on-box build,
      # source mount, or manual "Build Image". Full variant only (pcap-only
      # ships no agent). build-release.sh already tagged packetarch-agent:latest
      # (labeled org.packetarch.agent_version via the AGENT_VERSION build-arg).
      # NOTE: the GHCR package is created private on first push; make it PUBLIC
      # once in the repo's package settings so unauthenticated boxes can pull.
      - name: Log in to GHCR
        if: matrix.variant == 'full' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push agent image to GHCR
        if: matrix.variant == 'full' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Publish both the app-release version tag and :latest, pointing at the
          # canonical image build-release.sh produced.
          for tag in "${VERSION}" latest; do
              docker tag packetarch-agent:latest "ghcr.io/${OWNER}/packetarch-agent:${tag}"
              docker push "ghcr.io/${OWNER}/packetarch-agent:${tag}"
          done

  build-ova:
    name: Build OVA appliance
    # Self-hosted KVM host (see header). guestfs-tools + qemu + passwordless
    # sudo are expected to be present on the runner.
    runs-on: [self-hosted, ova-builder]
    timeout-minutes: 30
    steps:
      # build-ova.sh runs as root (virt-customize requires it). Older
      # versions of the script cached the Ubuntu image under the repo
      # checkout (dist/.ova-cache), which left a root-owned directory behind;
      # actions/checkout's pre-checkout `git clean` runs as the unprivileged
      # runner user and can't remove it, so every run after that failed with
      # EACCES before a single job step ran. The cache now lives outside the
      # checkout (OVA_CACHE_DIR, see build-ova.sh), but this step stays as a
      # permanent, harmless guard against any other stray root-owned file a
      # privileged step leaves in the workspace.
      - name: Ensure workspace is owned by the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history + tags, so the file:// clone can check out the tag
          fetch-tags: true

      - name: Resolve OVA git ref
        id: ovaref
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
              REF="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version_override }}" ]]; then
              REF="v${{ inputs.version_override }}"
          else
              REF="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          fi
          if [[ -z "${REF}" ]]; then echo "::error::no v* tag to build an OVA from"; exit 1; fi
          echo "REF=${REF}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "Building OVA from ref ${REF}"

      - name: Build OVA appliance
        run: |
          # This runner's ${RUNNER_TEMP} is not reliably wiped between jobs
          # (see the note on "Locate OVA" below) — old OVAs accumulate
          # otherwise, ~900MB+ each.
          sudo rm -rf "${RUNNER_TEMP}/ova-out"
          # VERSION is passed explicitly rather than left to build-ova.sh's
          # own OVA_GIT_REF-derived default, so the output filename is
          # always deterministic and matches what "Locate OVA" expects below.
          sudo env \
            OVA_GIT_REF="${{ steps.ovaref.outputs.REF }}" \
            VERSION="${{ steps.ovaref.outputs.VERSION }}" \
            OUT_DIR="${RUNNER_TEMP}/ova-out" \
            ./scripts/ova/build-ova.sh

      - name: Locate OVA
        id: ova
        run: |
          # Match the EXACT expected filename, not a `packetarch-*-appliance.ova`
          # glob. This runner's ${RUNNER_TEMP} is NOT reliably wiped between
          # jobs (self-hosted, unlike GitHub-hosted runners), so old OVAs from
          # prior builds/versions can still be sitting in ova-out/ — a glob
          # piped through plain `ls | head -1` sorts alphabetically and can
          # silently pick a stale OVA from an unrelated older version instead
          # of the one this run just built.
          OVA="${RUNNER_TEMP}/ova-out/packetarch-${{ steps.ovaref.outputs.VERSION }}-appliance.ova"
          if [[ ! -f "${OVA}" ]]; then echo "::error::expected OVA not found at ${OVA}"; exit 1; fi
          sudo chown "$(id -u):$(id -g)" "${OVA}"   # build-ova.sh runs as root
          echo "OVA=${OVA}" >> "$GITHUB_OUTPUT"
          echo "OVA: ${OVA} ($(du -h "${OVA}" | awk '{print $1}'))"

      - name: Upload OVA as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: packetarch-ova-appliance
          path: ${{ steps.ova.outputs.OVA }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach OVA to the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: PacketArch ${{ github.ref_name }}
          draft: true
          files: ${{ steps.ova.outputs.OVA }}
