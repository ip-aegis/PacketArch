      # - name: Tag and push backend/frontend/agent images
      #   env:
      #     VERSION: ${{ steps.version.outputs.VERSION }}
      #   run: |
      #     for img in backend frontend agent; do
      #         docker tag "packetarch/${img}:${VERSION}" \
      #             "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:${VERSION}"
      #         docker tag "packetarch/${img}:${VERSION}" \
      #             "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:latest"
      #         docker push "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:${VERSION}"
      #         docker push "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:latest"
      #     done
