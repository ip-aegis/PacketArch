name: Release

# Triggered by pushing a tag matching v*.
#
# Produces:
#   - THIRD_PARTY_LICENSES.md (best-effort; regenerated from pyproject + package.json)
#   - packetarch-<version>-offline.tar.gz (via scripts/build-release.sh)
#   - packetarch-<version>-appliance.ova  (via scripts/ova/build-ova.sh)
# These artifacts are attached to a GitHub Release for the pushed tag, and
# uploaded as workflow artifacts regardless of whether the release step
# succeeds (so failed-release builds are still recoverable).
#
# The OVA is built by the `build-ova` job below using libguestfs in software
# (TCG) mode — no KVM required on the runner — so a plain ubuntu-latest runner
# emits a ready-to-import appliance with the firmware-agnostic boot + baked
# console-user fixes.
#
# Optional GHCR image push is stubbed below — uncomment once the
# ip-aegis/packetarch repo has `packages: write` enabled and the desired
# image namespace has been confirmed with Rocky.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version tag to publish as (manual runs only)"
        required: false
        type: string

permissions:
  contents: write       # needed to create the GitHub Release
  # packages: write     # uncomment if publishing images to GHCR

jobs:
  build:
    name: Build release bundle (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            pcap_only: "0"
          - variant: pcap-only
            pcap_only: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # for `git describe` / commit metadata

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
              && -n "${{ inputs.version_override }}" ]]; then
              VERSION="${{ inputs.version_override }}"
          else
              VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      # Third-party attribution — best effort. A dep-resolution failure
      # should NOT block the release; the downstream build step logs
      # a warning if THIRD_PARTY_LICENSES.md is missing.
      - name: Install backend dependencies (for pip-licenses)
        run: |
          cd backend
          poetry install --no-interaction --no-root || true

      - name: Install frontend dependencies (for license-checker)
        run: |
          cd frontend
          pnpm install --frozen-lockfile || true

      - name: Generate third-party attribution
        continue-on-error: true
        run: ./scripts/generate_third_party_licenses.sh

      - name: Build offline release bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PCAP_ONLY: ${{ matrix.pcap_only }}
        run: ./scripts/build-release.sh

      - name: Compute artifact paths
        id: paths
        run: |
          if [[ "${{ matrix.variant }}" == "pcap-only" ]]; then
              TARBALL="$(ls dist/packetarch-*-pcap-offline.tar.gz | head -1)"
          else
              # Full variant: exclude any pcap-suffixed tarballs.
              TARBALL="$(ls dist/packetarch-*-offline.tar.gz | grep -v -- '-pcap-' | head -1)"
          fi
          echo "TARBALL=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Tarball: ${TARBALL} ($(du -h "${TARBALL}" | awk '{print $1}'))"

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: packetarch-offline-bundle-${{ matrix.variant }}
          path: |
            ${{ steps.paths.outputs.TARBALL }}
            THIRD_PARTY_LICENSES.md
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: PacketArch ${{ github.ref_name }}
          draft: true       # Rocky publishes manually after sanity-checking the assets
          generate_release_notes: true
          files: |
            ${{ steps.paths.outputs.TARBALL }}
            THIRD_PARTY_LICENSES.md
            LICENSE
            NOTICE

      # --- Optional: publish images to GHCR ---------------------------
      # Enable once `packages: write` is granted at the top of this file.
      #
      # - name: Log in to GHCR
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Tag and push backend/frontend/agent images
      #   env:
      #     VERSION: ${{ steps.version.outputs.VERSION }}
      #   run: |
      #     for img in backend frontend agent; do
      #         docker tag "packetarch/${img}:${VERSION}" \
      #             "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:${VERSION}"
      #         docker tag "packetarch/${img}:${VERSION}" \
      #             "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:latest"
      #         docker push "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:${VERSION}"
      #         docker push "ghcr.io/${{ github.repository_owner }}/packetarch-${img}:latest"
      #     done

  build-ova:
    name: Build OVA appliance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history + tags, so the file:// clone can check out the tag
          fetch-tags: true

      - name: Resolve OVA git ref
        id: ovaref
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
              REF="${GITHUB_REF_NAME}"                       # the pushed tag, e.g. v1.10.1
          elif [[ -n "${{ inputs.version_override }}" ]]; then
              REF="v${{ inputs.version_override }}"           # manual run: build a specific tag
          else
              REF="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          fi
          if [[ -z "${REF}" ]]; then
              echo "::error::no v* tag available to build an OVA from"; exit 1
          fi
          echo "REF=${REF}" >> "$GITHUB_OUTPUT"
          echo "Building OVA from ref ${REF}"

      - name: Install libguestfs + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils

      - name: Make host kernel readable for libguestfs
        # GitHub runners ship /boot/vmlinuz-* mode 600; libguestfs must read the
        # host kernel to build its appliance, otherwise: "supermin: ... cannot
        # read kernel". Harmless on runners where it's already readable.
        run: sudo chmod 0644 /boot/vmlinuz-* || true

      - name: Prepare work area on the large /mnt disk
        run: |
          sudo mkdir -p /mnt/ova-out
          sudo chown "$(id -u):$(id -g)" /mnt/ova-out
          df -h / /mnt | sed 's/^/  /'

      - name: Force libguestfs to use slirp networking
        # virt-customize --network defaults to passt on libguestfs 1.52, and
        # passt exits 1 in the hosted-runner sandbox ("passt exited with status
        # 1"). Moving the passt binary aside makes libguestfs fall back to
        # qemu's built-in slirp user-net, which works on the runner.
        run: |
          P="$(command -v passt || echo /usr/bin/passt)"
          if [ -e "$P" ]; then sudo mv "$P" "${P}.disabled" && echo "moved $P -> ${P}.disabled (slirp fallback)"; else echo "passt absent; slirp already in use"; fi

      - name: Build OVA appliance
        # build-ova.sh self-exports LIBGUESTFS_BACKEND=direct, which uses TCG
        # automatically when /dev/kvm is absent (the case on hosted runners).
        run: |
          sudo env \
            OVA_GIT_REF="${{ steps.ovaref.outputs.REF }}" \
            OUT_DIR=/mnt/ova-out \
            ./scripts/ova/build-ova.sh

      - name: Locate OVA
        id: ova
        run: |
          OVA="$(ls /mnt/ova-out/packetarch-*-appliance.ova 2>/dev/null | head -1)"
          if [[ ! -f "${OVA}" ]]; then echo "::error::OVA was not produced"; exit 1; fi
          echo "OVA=${OVA}" >> "$GITHUB_OUTPUT"
          echo "OVA: ${OVA} ($(du -h "${OVA}" | awk '{print $1}'))"

      - name: Upload OVA as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: packetarch-ova-appliance
          path: ${{ steps.ova.outputs.OVA }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach OVA to the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: PacketArch ${{ github.ref_name }}
          draft: true
          files: /mnt/ova-out/packetarch-*-appliance.ova
