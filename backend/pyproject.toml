[tool.poetry]
name = "packetarch-backend"
version = "1.4.0"
description = "OT Traffic Simulation Platform - Backend API"
authors = ["PacketArch Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# T0 hardening bumps (PacketArch 1.4.0): fastapi 0.109→0.118 (drags
# starlette ≥0.47 — multipart DoS fix CVE-2024-47874), cryptography
# 41→46 (multiple CVEs — JWT signing path), python-multipart 0.0.6→0.0.27
# (ReDoS + path-traversal fixes). All reachable by unauthenticated traffic
# pre-PR, so the bump is on the critical path for exposing port 443.
fastapi = "^0.118.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^46.0.0"
redis = "^5.0.1"
celery = {extras = ["redis"], version = "^5.3.6"}
scapy = "^2.5.0"
python-statemachine = "^2.1.2"
python-multipart = "^0.0.27"
httpx = "^0.26.0"
email-validator = "^2.1.0"
anthropic = "^0.79.0"
openai = "^1.60.0"
docker = "^7.0.0"
numpy = "^2.3.5"
scipy = "^1.16.3"
ldap3 = "^2.9.1"
reportlab = "^4.2.0"
# PacketArch Mimic — mature server-side Modbus stack for interactive device
# personas (bound socket, writable datastore, FC43 device identification,
# correct exceptions on malformed PDUs). See tasks/emulator-agent-design.md.
# Pinned to the 3.8.x line: pymodbus 3.9+ reworked the datastore/context API
# (ModbusSlaveContext→ModbusDeviceContext, datablock getValues/setValues removed).
# The persona server is validated against 3.8; migrating to 3.14 is a tracked
# follow-up (see tasks/mimic-build-plan.md) that needs re-validation of the block.
pymodbus = ">=3.8.0,<3.9.0"
# PacketArch Mimic — asyncio-native OPC UA server for device personas (address
# space, writable nodes, server identity). Pinned to the validated 2.0.x line
# (protocol libs churn within a major — see tasks/lessons.md).
asyncua = ">=2.0.1,<2.1.0"
# PacketArch Mimic — asyncio-native BACnet/IP stack for building-automation
# personas. Pre-1.0 (0.0.x): pinned tight, revalidate on bump (API may break).
bacpypes3 = ">=0.0.106,<0.1.0"
# PacketArch Mimic — IEC 60870-5-104 controlled station (Fraunhofer c104).
# Native C-extension; pinned to the validated 2.2.x line (revalidate on bump).
c104 = ">=2.2.1,<2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
aiosqlite = "^0.19.0"
black = "^23.12.1"
ruff = "^0.1.11"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Dev/utility scripts and tests set up sys.path / do ordering-sensitive
# imports before importing app modules — E402 is expected there.
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
# Alembic migrations are auto-generated; the template emits a trailing
# space after "Revises:" (W291) and imports after the docstring (E402).
"alembic/**" = ["E402", "W291"]
# Deliberate late imports: FastAPI include_router at file end, builder
# side-effect registration, _-aliased local imports, and TYPE_CHECKING
# forward-ref blocks that must follow the module body.
"app/api/routes/ai.py" = ["E402"]
"app/api/routes/scenarios.py" = ["E402"]
"app/services/seed_data.py" = ["E402"]
"app/protocol_engines/identity/__init__.py" = ["E402"]
"app/protocol_engines/modbus/rtu_packets.py" = ["E402"]
"app/protocol_engines/fingerprint_applicator.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow-running",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
