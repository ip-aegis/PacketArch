# PacketArch Agent Stack (standalone)
#
# Two services that mirror what install.sh generates:
#   agent       the traffic agent (host net, raw sockets). NO docker.sock.
#   supervisor  same image, supervisor role. Owns the agent's lifecycle and
#               performs self-updates (UPDATE_AGENT) from OUTSIDE the agent.
#               Holds the ONLY docker.sock mount.
# They share the `agent_state` volume (file-queue). See app/supervisor.py.
#
# Set AGENT_INSTALL_PATH to the directory holding THIS file so the supervisor
# can recreate the agent service via docker compose on the host daemon.

services:
  agent:
    image: packetarch-agent:latest
    container_name: packetarch-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PACKETARCH_SERVER=${PACKETARCH_SERVER}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - DEFAULT_INTERFACE=${DEFAULT_INTERFACE:-eth0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SSL_VERIFY=${SSL_VERIFY:-false}
      - AGENT_SUPERVISED=true
      - AGENT_STATE_DIR=/state
    volumes:
      - agent_state:/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - supervisor

  supervisor:
    image: packetarch-agent:latest
    container_name: packetarch-agent-supervisor
    restart: unless-stopped
    # Override the image ENTRYPOINT (python -m app.main) — `command:` would be
    # APPENDED to it and just start a second agent instead of the supervisor.
    entrypoint: ["python", "-m", "app.supervisor"]
    environment:
      - AGENT_STATE_DIR=/state
      - AGENT_INSTALL_DIR=${AGENT_INSTALL_PATH:-/opt/packetarch-agent}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # The supervisor is the ONLY component with the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AGENT_INSTALL_PATH:-/opt/packetarch-agent}:${AGENT_INSTALL_PATH:-/opt/packetarch-agent}
      - agent_state:/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent_state:
