repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Enforce GPL-3.0 copyright headers on source files.
  # Runs in --check mode; use `python scripts/add_copyright_headers.py --fix`
  # to insert missing headers. See scripts/add_copyright_headers.py for rules.
  - repo: local
    hooks:
      - id: copyright-headers
        name: GPL-3.0 copyright headers
        entry: python scripts/add_copyright_headers.py --check
        language: system
        types_or: [python, javascript, jsx, ts, tsx]
        pass_filenames: false
